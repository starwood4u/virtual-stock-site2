name: Sync SVN to GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: '*/59 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install SVN and rsync
        run: sudo apt-get update && sudo apt-get install -y subversion rsync

      - name: Checkout SVN and Push to GitHub
        env:
          SVN_USER: ${{ secrets.SVN_USERNAME }}
          SVN_PASS: ${{ secrets.SVN_PASSWORD }}
        run: |
          echo "=== 1. SVN 체크아웃 시도 ==="
          svn checkout https://riouxsvn.com/svn/svn-1 ./svn_temp --username "$SVN_USER" --password "$SVN_PASS" --non-interactive
          
          echo "=== 2. 체크아웃된 폴더 확인 ==="
          ls -la ./svn_temp
          
          echo "=== 3. rsync를 이용한 안전한 파일 동기화 ==="
          # svn_temp 안의 내용을 .git과 .github 폴더를 제외하고 현재 디렉토리로 동기화
          rsync -av --exclude='.svn' --exclude='.git' --exclude='.github' ./svn_temp/ ./
          
          # 임시 체크아웃 폴더 삭제
          rm -rf ./svn_temp
          
          echo "=== 4. Git Push 진행 ==="
          git config --global user.name "SVN Sync Bot"
          git config --global user.email "bot@users.noreply.github.com"
          
          git add .
          if git diff --cached --quiet; then
            echo "No changes to sync from RiouxSVN."
          else
            git commit -m "Auto-sync from RiouxSVN"
            git push origin main
          fi
