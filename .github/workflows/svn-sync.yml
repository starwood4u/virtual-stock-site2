name: Sync SVN to GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Checkout SVN and Push to GitHub
        env:
          SVN_USER: ${{ secrets.SVN_USERNAME }}
          SVN_PASS: ${{ secrets.SVN_PASSWORD }}
        run: |
          # 1. RiouxSVN 소스 체크아웃 (본인 주소로 정확히 입력되었는지 재확인)
          svn checkout https://riouxsvn.com/svn/svn-1 ./svn_temp --username "$SVN_USER" --password "$SVN_PASS" --non-interactive
          
          # 2. SVN 메타데이터 제거
          rm -rf ./svn_temp/.svn
          
          # 3. 기존 파일 정리 및 SVN 파일로 교체 (.git, .github 폴더 보존)
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -r ./svn_temp/. .
          
          # 4. Git 설정 및 변경 감지 후 푸시 (에러 방지 처리 추가)
          git config --global user.name "SVN Sync Bot"
          git config --global user.email "bot@users.noreply.github.com"
          
          git add .
          
          # 변경된 내용이 있는 경우에만 commit 및 push 수행
          if git diff --cached --quiet; then
            echo "No changes to sync from RiouxSVN."
          else
            git commit -m "Auto-sync from RiouxSVN"
            git push origin main
          fi
